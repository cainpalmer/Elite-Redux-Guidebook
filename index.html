<title>ER Pocket Dex</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#e6ece7;--ink:#16252b;--mute:#566a6f;--card:#f6f9f6;--line:#c4d0c8;--t:#7a8;--t2:#456;--bar:#16252b;--barink:#f2f7f3}
@media(prefers-color-scheme:dark){:root{--paper:#0f1719;--ink:#e6efe9;--mute:#9bacaa;--card:#182327;--line:#2a3a3e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barink);padding:calc(8px + env(safe-area-inset-top,0)) 10px 8px;display:flex;gap:8px;align-items:center}
header button{background:#ffffff1f;border:0;color:inherit;font-size:22px;width:44px;height:44px;border-radius:10px}
header input{flex:1;min-width:0;height:44px;border-radius:10px;border:0;padding:0 12px;font:inherit;background:#ffffff26;color:inherit}
header input::placeholder{color:#c9d6d0}
#res{position:fixed;left:0;right:0;top:calc(60px + env(safe-area-inset-top,0));max-height:60vh;overflow:auto;background:var(--card);border-bottom:2px solid var(--line);z-index:6;display:none}
#res a{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
#res img{width:40px;height:40px;image-rendering:pixelated}
#stage{position:relative;perspective:1900px;overflow-x:clip;--lx:0px;--ly:0px}
#page,.leaf{max-width:600px;margin:0 auto;padding:0 0 40px;min-height:80vh;background:var(--paper);touch-action:pan-y}
.leaf{position:absolute;top:var(--ly);left:var(--lx);right:var(--lx);overflow:hidden;min-height:0;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 30px #0006;pointer-events:none;z-index:4}
@media(min-width:720px){
 #stage{--lx:24px;--ly:20px;padding:20px 24px 28px}
 #page,.leaf{max-width:1100px;padding:0;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px #0003}
 .leaf{left:calc(var(--lx) + (100% - 48px - min(1100px,100% - 48px))/2);right:calc(var(--lx) + (100% - 48px - min(1100px,100% - 48px))/2);top:var(--ly);padding:0;transform-origin:50% 50%}
 .spread{display:grid;grid-template-columns:1fr 1fr;min-height:70vh}
 .pg{padding-bottom:18px}
 .pg.l{box-shadow:inset -16px 0 20px -16px #0004}
 .pg.r{border-left:1px solid var(--line);box-shadow:inset 16px 0 20px -16px #0004;padding-top:2px}
 .hero{margin:12px 12px 0;border-radius:12px}
 h1{font-size:36px}
 header{justify-content:center}header input{flex:0 1 520px}
 #res{left:50%;right:auto;transform:translateX(-50%);width:min(560px,96vw);border:2px solid var(--line);border-radius:0 0 12px 12px}
}

.views{display:flex;gap:6px;justify-content:center;margin-top:12px}.views button{flex:1;max-width:88px;background:#ffffff2e;border:2px solid transparent;border-radius:10px;padding:4px 2px;color:#fff;font:inherit;font-size:11px;display:grid;justify-items:center;cursor:pointer}.views button.on{border-color:#fff;background:#ffffff5c}.views img{width:44px;height:44px;image-rendering:pixelated;object-fit:contain}
h1{font:700 30px/1.1 "Pixelify Sans",system-ui,sans-serif;margin:12px 0 4px;color:#fff;text-shadow:0 2px 0 #0003}
.no{color:#ffffffd9;font-size:14px}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#fff;background:color-mix(in srgb,var(--c) 80%,#000);border:2px solid #0003;text-shadow:0 1px 0 #0004}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 12px 0;padding:12px 14px}
h2{font:700 17px "Pixelify Sans",system-ui,sans-serif;margin:0 0 8px}
.desc{font-style:italic;color:var(--mute);margin:0}
.st{display:grid;grid-template-columns:38px 36px 1fr;gap:6px 8px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t)}
.ab{margin:0 0 8px}.ab b{display:block}.ab span{color:var(--mute);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute);margin-top:8px}
details{margin:0}summary{cursor:pointer;font:700 17px "Pixelify Sans",system-ui,sans-serif;padding:2px 0}
.mv{display:grid;grid-template-columns:34px 1fr auto;gap:2px 8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mv .lv{color:var(--mute);text-align:right;font-weight:700}
.mv .nm{font-weight:700}.mv small{grid-column:2/4;color:var(--mute)}
.mv .chip{font-size:11px;padding:0 7px;margin-left:6px}
.num{color:var(--mute);white-space:nowrap}
.link{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--t);text-underline-offset:3px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.leaf{display:none}}
.fbar{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 12px 0;padding:8px 12px;font-size:14px;box-shadow:0 4px 10px -6px #0005}
.fbar span{color:var(--mute);margin-right:2px}
.fbar button{display:flex;align-items:center;gap:6px;background:none;color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}
.fbar button i{width:10px;height:10px;border-radius:50%}
.fbar button.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.mv{transition:opacity .15s}.mv.dim{opacity:.35}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;height:54px;background:none;border:0;border-top:3px solid transparent;color:#b9c9c2;font:700 13px "Atkinson Hyperlegible",system-ui,sans-serif}
#tabs button.on{color:#fff;border-top-color:var(--t)}
body:not([data-tab="dex"]) #prev,body:not([data-tab="dex"]) #next{visibility:hidden}
#other{max-width:720px;margin:0 auto;padding:12px 12px 24px}
.vbar{display:flex;gap:8px;margin-bottom:10px}
.vbar select{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 8px}
.cnt{color:var(--mute);font-size:13px;margin:0 2px 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rh .num{margin-left:auto;font-size:13px}
.row .d{color:var(--mute);font-size:14px;margin-top:2px}
.det{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:14px;cursor:auto}
.det p{margin:6px 0}.row.open .det{display:block}.row.open{border-color:var(--t)}
.chips2{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:260px;overflow:auto}
.more{display:block;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.msg{padding:40px 20px;text-align:center;color:var(--mute)}
button.sh{background:none;border:1px solid #fff9;color:#fff;border-radius:99px;padding:3px 12px;margin-top:8px;font:inherit;font-size:13px}
</style>
</head>
<body>
<header>
  <button id="prev" aria-label="Previous page">‹</button>
  <input id="q" type="search" placeholder="Search a Pokémon" autocomplete="off" aria-label="Search">
  <button id="next" aria-label="Next page">›</button>
</header>
<div id="res"></div>
<div id="stage"><main id="page"><div class="msg">Opening the book…</div></main></div>
<div id="other" hidden></div>
<nav id="tabs" aria-label="Sections"><button data-t="dex" class="on">Pokédex</button><button data-t="abilities">Abilities</button><button data-t="moves">Moves</button><button data-t="locations">Locations</button></nav>
<script>
const BASES=["https://forwardfeed.github.io/ER-nextdex/static/","https://forwardfeed.github.io/ER-nextdex/","https://raw.githubusercontent.com/ForwardFeed/ER-nextdex/main/static/"];
const FALLBACK_VERSION="2.65.5";
const TC={Normal:"#a8a77a",Fighting:"#c22e28",Fire:"#ee8130",Ice:"#96d9d6",Electric:"#f7d02c",Bug:"#a6b91a",Flying:"#a98ff3",Steel:"#b7b7ce",Grass:"#7ac74c",Ground:"#e2bf65",Poison:"#a33ea1",Dark:"#705746",Water:"#6390f0",Psychic:"#f95587",Rock:"#b6a136",Dragon:"#6f35fc",Ghost:"#735797",Fairy:"#d685ad",Stellar:"#40b5a5",Mystery:"#68a090",None:"#889"};
const STATS=["HP","Atk","Def","SpA","SpD","Spe"],SPLIT=["Phys","Spec","Status","Highest atk","Hits Def","Highest dmg","Hits SpD"],CATS=[[0],[1],[2],[0,1],[1],[0,1],[0]],FN=["Phys","Spec","Status"],FC=["#d8602f","#3f78d0","#7d8b8f"];
const fsel=new Set();
let mode="dex";try{mode=localStorage.getItem("order")||"dex"}catch(e){}
let D,base,list=[],byId={},mv={},ab={},enc={},cur=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tn=i=>D.typeT[i]??"?";
const chip=i=>`<span class="chip" style="--c:${TC[tn(i)]||"#889"}">${esc(tn(i))}</span>`;
const clean=s=>String(s).replace(/^(ITEM_|SPECIES_|MOVE_)/,"").toLowerCase().replace(/_/g," ");

async function getText(u){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(r.status);return r}
async function load(){
  let lastErr;
  for(const b of BASES){
    try{
      let v=FALLBACK_VERSION;
      try{const t=await(await getText(b+"js/data_version.js")).text();const m=t.match(/allVersions\s*=\s*\[([^\]]*)\]/);if(m){const a=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);if(a.length)v=a[a.length-1]}}catch(e){}
      D=await(await getText(`${b}js/data/gameDataV${v}.json`)).json();
      base=b;D._v=v;return;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error("no data");
}
function dexOrder(){
  const g=new Map(),out=[],isM=x=>/ Mega\b/.test(x.name),bn=x=>x.name.replace(/ Mega( [XYZ])?\b/,"");
  for(const x of list){const k=x.dex?.id||1e9;if(!g.has(k))g.set(k,[]);g.get(k).push(x)}
  [...g.keys()].sort((p,q)=>p-q).forEach(k=>{
    const v=g.get(k).sort((p,q)=>p.id-q.id),megas=v.filter(isM),used=new Set();
    v.filter(x=>!isM(x)).forEach(n=>{out.push(n);megas.forEach(m=>{if(!used.has(m)&&bn(m)===n.name){used.add(m);out.push(m)}})});
    megas.forEach(m=>{if(!used.has(m))out.push(m)});
  });
  return out;
}
function sortList(){const o=mode==="dex"?dexOrder():[...list].sort((p,q)=>p.id-q.id);list.splice(0,list.length,...o);list.forEach((s,i)=>{s._i=i;byId[s.id]=s})}
function index(){
  D.moves.forEach(m=>{mv[m.id]=m;MOVE[m.NAME]=m.name});D.items.forEach(x=>ITEM[x.NAME]=x.name);D.abilities.forEach(a=>ab[a.id]=a);
  list=D.species.filter(s=>s.id>0&&s.name&&s.name!=="??????????");
  sortList();
  const kinds=["land","water","fish","honey","rock","hidden"],label={land:"Grass",water:"Surfing",fish:"Fishing",honey:"Honey tree",rock:"Rock Smash",hidden:"Hidden"};
  for(const m of (D.locations.maps||[]))for(const k in m){
    if(!Array.isArray(m[k])||!Array.isArray(m[k][0])||m[k][0].length!==3)continue;
    for(const [lo,hi,sp] of m[k]){const sid=sp>0?D.species[sp]?.id:null;if(sid==null)continue;(enc[sid]??=new Map()).set(m.id+k,{map:D.mapsT[m.id]||"Unnamed area",how:label[k]||k,lo:Math.min(lo,hi),hi:Math.max(lo,hi)})}
  }
}
const SUF=["","_SHINY","_BACK","_BACK_SHINY"],VN=["Front","Shiny","Back","Shiny back"];let view=0;
const spUrl=(s,v)=>"sprites/"+s.NAME.replace(/^SPECIES_/,"")+SUF[v|0]+".png";
window.fb=function(img,n){const b=BASES.indexOf(base);n=n||0;const next=BASES.filter(x=>x!==base)[n];if(!next){img.style.display="none";return}img.onerror=()=>fb(img,n+1);img.src=next+img.dataset.p};
function sprite(s,sh){return `<img data-p="${spUrl(s,sh)}" src="${base+spUrl(s,sh)}" alt="${esc(s.name)} sprite" onerror="fb(this)">`}

function moveRow(id,lv){
  const m=mv[id];if(!m)return"";
  const p=m.pwr?m.pwr:"—",a=m.acc?m.acc:"—";
  return `<div class="mv" data-c="${CATS[m.split]||""}"><span class="lv">${lv??""}</span><span><span class="nm">${esc(m.name)}</span>${chip(m.types[0])}</span><span class="num">${SPLIT[m.split]||""} · ${p}/${a}/${m.pp}</span><small>${esc(m.desc)}</small></div>`;
}
function box(title,ids,lv){
  if(!ids||!ids.length)return"";
  return `<section><details open><summary>${title} (${ids.length})</summary>${ids.map((x,i)=>moveRow(lv?x.id:x,lv?x.lv:"")).join("")}</details></section>`;
}
const ITEM={},MOVE={};
function evoText(kd,rs){
  const k=D.evoKindT[kd],it=r=>ITEM[r]||clean(r),mo=r=>MOVE[r]||clean(r);
  return k==="EVO_LEVEL"?"Level "+rs:k==="EVO_LEVEL_MALE"?`Level ${rs} if male`:k==="EVO_LEVEL_FEMALE"?`Level ${rs} if female`:
  k==="EVO_MEGA_EVOLUTION"?"Mega evolves with "+it(rs):k==="EVO_MOVE_MEGA_EVOLUTION"?"Mega evolves with "+mo(rs):
  k==="EVO_PRIMAL_REVERSION"?"Primal reversion":clean(k.replace("EVO_",""))+(rs?" "+clean(rs):"");
}
const lnk=id=>byId[id]?`<a class="link" data-go="${id}">${esc(byId[id].name)}</a>`:"?";

function applyFilter(root){
  root.querySelectorAll(".mv[data-c]").forEach(r=>{const c=r.dataset.c.split(",").filter(Boolean).map(Number);r.classList.toggle("dim",fsel.size>0&&!c.some(x=>fsel.has(x)))});
}
function build(i,shiny){
  const s=list[i],st=s.stats,bst=st.base.reduce((a,b)=>a+b,0);
  const types=[...new Set(st.types)].filter(t=>tn(t)!=="None"&&tn(t)!=="Mystery");
  const abis=[...new Set(st.abis)].filter(x=>x),inns=[...new Set(st.inns)].filter(x=>x);
  const A=a=>`<div class="ab"><b>${esc(ab[a]?.name)}</b><span>${esc(ab[a]?.desc)}</span></div>`;
  const into=s.evolutions.filter(e=>e.in>0&&D.species[e.in]).map(e=>`${lnk(D.species[e.in].id)} <span class="num">${esc(evoText(e.kd,e.rs))}</span>`);
  const from=[];list.forEach(o=>o.evolutions.forEach(e=>{if(e.in>0&&D.species[e.in]?.id===s.id)from.push(`${lnk(o.id)} <span class="num">${esc(evoText(e.kd,e.rs))}</span>`)}));
  const forms=(s.forms||[]).map(x=>D.species[x]).filter(Boolean);
  const places=[...(enc[s.id]?.values()||[])].map(e=>`${esc(e.map)} <span class="num">${e.how}, Lv ${e.lo===e.hi?e.lo:e.lo+"–"+e.hi}</span>`);
  (s.SEnc||[]).forEach(e=>places.push(`${esc(D.mapsT[e.map]||"Unnamed area")} <span class="num">${esc(D.scriptedEncoutersHowT[e.how]||"")}</span>`));
  const egg=st.eggG.map(g=>clean(D.eggT[g]||"").replace("egg group ","")).join(", ");
  const hw=s.dex?.hw;
  const mvs=box("Level-up moves",s.levelUpMoves,1)+box("Egg moves",s.eggMoves)+box("TM / HM moves",s.TMHMMoves)+box("Tutor moves",s.tutor);
  const bar=mvs?`<div class="fbar"><span>Highlight</span>${FN.map((n,k)=>`<button data-f="${k}" class="${fsel.has(k)?"on":""}" aria-pressed="${fsel.has(k)}"><i style="background:${FC[k]}"></i>${n}</button>`).join("")}</div>`:"";
  const html=`<div class="spread"><div class="pg l">
  <div class="hero"><div class="art" id="art">${sprite(s,view)}</div>
    <div class="views">${VN.map((n,k)=>`<button data-v="${k}" class="${k===view?"on":""}" aria-label="${n}">${sprite(s,k)}<span>${n}</span></button>`).join("")}</div>
    <h1>${esc(s.name)}</h1><div class="no">No. ${s.dex?.id||"??"} · page ${i+1} of ${list.length}</div>
    <div class="chips">${types.map(chip).join("")}</div></div>
  ${s.dex?.desc||hw?`<section>${s.dex?.desc?`<p class="desc">${esc(s.dex.desc)}</p>`:""}${hw?`<div class="meta"><span>Height ${(hw[0]/10).toFixed(1)} m</span><span>Weight ${(hw[1]/10).toFixed(1)} kg</span></div>`:""}</section>`:""}
  <section><h2>Base stats · ${bst}</h2><div class="st">${st.base.map((v,k)=>`<span>${STATS[k]}</span><b>${v}</b><div class="bar"><i style="width:${Math.min(100,v/180*100)}%"></i></div>`).join("")}</div></section>
  <section><h2>Abilities</h2>${abis.map(A).join("")||"—"}</section>
  <section><h2>Innates</h2>${inns.map(A).join("")||"—"}</section></div>
  <div class="pg r">
  ${into.length||from.length?`<section><h2>Evolution</h2>${from.map(x=>`<div>From ${x}</div>`).join("")}${into.map(x=>`<div>Into ${x}</div>`).join("")}</section>`:""}
  ${forms.length?`<section><h2>Other forms</h2>${forms.map(f=>`<div>${lnk(f.id)}</div>`).join("")}</section>`:""}
  ${places.length?`<section><details open><summary>Where to find (${places.length})</summary>${places.map(p=>`<div class="mv" style="display:block">${p}</div>`).join("")}</details></section>`:""}
  ${bar}${mvs}
  <section><div class="meta"><span>Egg group: ${esc(egg||"—")}</span><span>EV yield: ${st.EVY.map((v,k)=>v?v+" "+STATS[k]:"").filter(Boolean).join(", ")||"—"}</span><span>Data v${esc(D._v)}</span><span><a class="link" id="ord">Order: ${mode==="dex"?"Dex number":"Game order"} (tap to switch)</a></span></div></section></div></div>`;
  const c1=TC[tn(types[0]??st.types[0])]||"#7a8",c2=types[1]!=null?TC[tn(types[1])]:`color-mix(in srgb,${c1} 55%,#101830)`;
  return{html,t:c1,t2:c2};
}
function render(i,shiny,flip){
  i=Math.max(0,Math.min(list.length-1,i));
  const page=$("#page"),stage=$("#stage"),root=document.documentElement,old=cur;
  const cs=getComputedStyle(root),oldT=cs.getPropertyValue("--t"),oldT2=cs.getPropertyValue("--t2"),b=build(i,shiny);
  const dir=i>old?1:-1,wide=matchMedia("(min-width:720px)").matches;
  const anim=flip&&i!==old&&page.firstElementChild&&!matchMedia("(prefers-reduced-motion:reduce)").matches;
  stage.querySelectorAll(".leaf").forEach(l=>l.remove());
  cur=i;try{history.replaceState(null,"","#"+list[i].id)}catch(e){}
  const apply=()=>{page.innerHTML=b.html;root.style.setProperty("--t",b.t);root.style.setProperty("--t2",b.t2);applyFilter(page);
    const fb2=page.querySelectorAll(".fbar button");fb2.forEach(bt=>bt.onclick=()=>{const k=+bt.dataset.f;fsel.has(k)?fsel.delete(k):fsel.add(k);fb2.forEach(x=>{const on=fsel.has(+x.dataset.f);x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});applyFilter(page)});
    const vb=page.querySelectorAll(".views button");vb.forEach(bt=>bt.onclick=()=>{view=+bt.dataset.v;page.querySelector("#art").innerHTML=sprite(list[cur],view);vb.forEach(x=>x.classList.toggle("on",x===bt))});
    const o=page.querySelector("#ord");if(o)o.onclick=()=>{mode=mode==="dex"?"game":"dex";try{localStorage.setItem("order",mode)}catch(e){}const id=list[cur].id;sortList();render(byId[id]._i)}};
  scrollTo(0,0);
  if(!anim){apply();return}
  const leaf=document.createElement("div");leaf.className="leaf";
  leaf.style.height=Math.min(page.offsetHeight,innerHeight-70)+"px";
  leaf.style.setProperty("--t",dir>0?oldT:b.t);leaf.style.setProperty("--t2",dir>0?oldT2:b.t2);
  if(dir>0){leaf.innerHTML=page.innerHTML;apply()}else{leaf.innerHTML=b.html;applyFilter(leaf)}
  if(wide)leaf.style.clipPath=dir>0?"inset(0 0 0 50%)":"inset(0 50% 0 0)";
  stage.appendChild(leaf);
  const ang=wide&&dir<0?120:-120,dim="brightness(.72)";
  const kf=[{transform:"rotateY(0deg)",filter:"brightness(1)"},{transform:`rotateY(${ang}deg)`,filter:dim}];
  if(dir<0)kf.reverse();
  const done=()=>{if(!leaf.isConnected)return;leaf.remove();if(dir<0&&cur===i)apply()};
  const an=leaf.animate(kf,{duration:720,easing:"cubic-bezier(.45,.05,.35,1)",fill:"both"});
  an.onfinish=done;setTimeout(done,1000);
}
const go=id=>byId[id]&&render(byId[id]._i,false,true);
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(a){e.preventDefault();$("#res").style.display="none";$("#q").blur();setTab("dex");go(+a.dataset.go)}});
$("#prev").onclick=()=>render(cur-1,false,true);$("#next").onclick=()=>render(cur+1,false,true);
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||tab!=="dex")return;if(e.key==="ArrowLeft")render(cur-1,false,true);if(e.key==="ArrowRight")render(cur+1,false,true)});
let x0,y0;
$("#page").addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
$("#page").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy))render(cur+(dx<0?1:-1),false,true)},{passive:true});
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase(),r=$("#res");if(tab!=="dex"){lim=60;fill();return}
  if(!q||!list.length){r.style.display="none";return}
  const hits=list.filter(s=>s.name.toLowerCase().includes(q)||String(s.dex?.id)===q).slice(0,40);
  r.innerHTML=hits.map(s=>`<a href="#${s.id}" data-go="${s.id}">${sprite(s)}<span><b>${esc(s.name)}</b> <span class="num">No. ${s.dex?.id||"??"}</span></span></a>`).join("")||`<div class="msg">No Pokémon matches “${esc(q)}”.</div>`;
  r.style.display="block";
});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS[h]&&h!=="dex"){if(tab!==h)setTab(h);return}if(+h&&tab!=="dex")setTab("dex");const id=+location.hash.slice(1);if(id&&list.length&&byId[id]&&list[cur]?.id!==id)go(id)});

/* ---- Abilities / Moves / Locations ---- */
let tab="dex",lim=60,ABL=[],MVL=[],LCL=[];const abN={};
const TABS={dex:"Search a Pokémon",abilities:"Search abilities",moves:"Search moves",locations:"Search places or Pokémon"};
function indexExtra(){
  const label={land:"Grass",water:"Surfing",fish:"Fishing",honey:"Honey tree",rock:"Rock Smash",hidden:"Hidden"};
  list.forEach(s=>new Set([...s.stats.abis,...s.stats.inns]).forEach(a=>abN[a]=(abN[a]||0)+1));
  const byName=(a,b)=>a.a.name.localeCompare(b.a.name);
  ABL=D.abilities.filter(a=>a.id>0&&a.name&&!/^-+$/.test(a.name)).map(a=>({a,t:(a.name+" "+a.desc).toLowerCase()})).sort(byName);
  MVL=D.moves.filter(m=>m.name&&!/^-+$/.test(m.name)).map(m=>({a:m,t:(m.name+" "+m.desc).toLowerCase()})).sort(byName);
  LCL=(D.locations.maps||[]).map(m=>{
    const meth=[];
    for(const k in m){
      if(!Array.isArray(m[k])||!Array.isArray(m[k][0])||m[k][0].length!==3)continue;
      const mp=new Map();
      for(const [lo,hi,sp] of m[k]){const sc=sp>0?D.species[sp]:null;if(!sc)continue;const o=mp.get(sc.id)||{lo:999,hi:0,s:sc};o.lo=Math.min(o.lo,lo,hi);o.hi=Math.max(o.hi,lo,hi);mp.set(sc.id,o)}
      if(mp.size)meth.push([label[k]||k,[...mp.values()]]);
    }
    const name=D.mapsT[m.id]||"Unnamed area";
    return{id:m.id,name,meth,n:new Set(meth.flatMap(x=>x[1].map(o=>o.s.id))).size,t:(name+" "+meth.map(x=>x[1].map(o=>o.s.name).join(" ")).join(" ")).toLowerCase()};
  }).filter(l=>l.meth.length);
}
function setTab(t){
  tab=t;document.body.dataset.tab=t;lim=60;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("#stage").hidden=t!=="dex";$("#other").hidden=t==="dex";
  const q=$("#q");q.value="";q.placeholder=TABS[t];$("#res").style.display="none";
  try{history.replaceState(null,"","#"+(t==="dex"?list[cur].id:t))}catch(e){}
  if(t!=="dex"){
    $("#other").innerHTML=(t==="moves"?`<div class="vbar"><select id="ft" aria-label="Type"><option value="">All types</option>${D.typeT.map((n,i)=>n!=="None"&&n!=="Mystery"?`<option value="${i}">${n}</option>`:"").join("")}</select><select id="fc" aria-label="Category"><option value="">All categories</option><option value="0">Physical</option><option value="1">Special</option><option value="2">Status</option></select></div>`:"")+'<div id="vlist"></div>';
    fill();
  }
  scrollTo(0,0);
}
function fill(){
  const box=$("#vlist");if(!box)return;
  const q=$("#q").value.trim().toLowerCase();let all,row;
  if(tab==="abilities"){
    all=ABL.filter(x=>!q||x.t.includes(q));
    row=({a})=>`<div class="row" data-k="ab" data-i="${a.id}"><div class="rh"><b>${esc(a.name)}</b><span class="num">${abN[a.id]||0} Pokémon</span></div><div class="d">${esc(a.desc)}</div><div class="det"></div></div>`;
  }else if(tab==="moves"){
    const ft=$("#ft")?.value,fc=$("#fc")?.value;
    all=MVL.filter(x=>(!q||x.t.includes(q))&&(!ft||x.a.types.includes(+ft))&&(!fc||(CATS[x.a.split]||[]).includes(+fc)));
    row=({a:m})=>`<div class="row" data-k="mv" data-i="${m.id}"><div class="rh"><b>${esc(m.name)}</b>${chip(m.types[0])}<span class="num">${SPLIT[m.split]||""} · ${m.pwr||"—"}/${m.acc||"—"}/${m.pp}</span></div><div class="d">${esc(m.desc)}</div><div class="det"></div></div>`;
  }else{
    all=LCL.filter(x=>!q||x.t.includes(q));
    row=l=>`<div class="row" data-k="lc" data-i="${l.id}"><div class="rh"><b>${esc(l.name)}</b><span class="num">${l.n} Pokémon</span></div><div class="det"></div></div>`;
  }
  if(q){const nm=x=>(x.a?x.a.name:x.name).toLowerCase().includes(q);all=[...all.filter(nm),...all.filter(x=>!nm(x))]}
  box.innerHTML=`<div class="cnt">${all.length} result${all.length===1?"":"s"}</div>`+(all.length?all.slice(0,lim).map(row).join(""):'<div class="msg">No matches.</div>')+(all.length>lim?'<button class="more">Show more</button>':"");
}
const chipsOf=(arr,cap=150)=>`<div class="chips2">${arr.slice(0,cap).map(s=>lnk(s.id)).join("")}</div>${arr.length>cap?`<div class="num">and ${arr.length-cap} more</div>`:""}`;
function detail(k,i){
  if(k==="ab"){const A=list.filter(s=>s.stats.abis.includes(i)),I=list.filter(s=>s.stats.inns.includes(i));
    return `<p><b>Ability of ${A.length}</b></p>${chipsOf(A)}<p><b>Innate of ${I.length}</b></p>${chipsOf(I)}`}
  if(k==="mv"){const m=mv[i],L=list.filter(s=>s.levelUpMoves.some(x=>x.id===i)||s.eggMoves.includes(i)||s.tutor.includes(i)||s.TMHMMoves.includes(i));
    const info=[m.prio?`Priority ${m.prio>0?"+":""}${m.prio}`:"",D.targetT[m.target]?"Target: "+clean(D.targetT[m.target]):"",m.chance?`${m.chance}% effect chance`:"",...(m.flags||[]).map(f=>D.flagsT[f])].filter(Boolean);
    return `<p>${esc(m.lDesc||m.desc)}</p><p class="num">${esc(info.join(" · "))}</p><p><b>Learned by ${L.length}</b></p>${chipsOf(L)}`}
  const l=LCL.find(x=>x.id===i);
  return l.meth.map(([n,arr])=>`<p><b>${esc(n)}</b></p><div class="chips2">${arr.map(o=>`<span>${lnk(o.s.id)} <span class="num">Lv ${o.lo===o.hi?o.lo:o.lo+"–"+o.hi}</span></span>`).join("")}</div>`).join("");
}
$("#other").addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  if(e.target.closest(".more")){lim+=60;fill();return}
  const r=e.target.closest(".row");if(!r||e.target.closest(".det"))return;
  r.classList.toggle("open");const dt=r.querySelector(".det");
  if(!dt.dataset.done){dt.dataset.done=1;dt.innerHTML=detail(r.dataset.k,+r.dataset.i)}
});
$("#other").addEventListener("change",e=>{if(e.target.matches("select")){lim=60;fill()}});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
(async function boot(){
  try{await load();index();indexExtra();const h0=location.hash.slice(1),id=+h0;render(byId[id]?byId[id]._i:0);if(TABS[h0]&&h0!=="dex")setTab(h0)}
  catch(e){const web=/^https?:/.test(location.protocol);$("#page").innerHTML=`<div class="msg">${D&&list.length?"The data loaded, but a page failed to draw.":"Couldn’t load the data from the NextDex site."}<br><br>Reason: ${esc(e&&e.message||e)}<br><br>${web?"":"This file was opened straight from storage or a preview, which blocks loading data. Host it online (for example GitHub Pages) and open that address in your phone’s browser.<br><br>"}<a class="link" onclick="location.reload()">Try again</a></div>`}
})();
</script>
