<title>ER Pocket Dex</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#e6ece7;--ink:#16252b;--mute:#566a6f;--card:#f6f9f6;--line:#c4d0c8;--t:#7a8;--t2:#456;--maxw:1100px;--bar:#16252b;--barink:#f2f7f3}
@media(prefers-color-scheme:dark){:root{--paper:#0f1719;--ink:#e6efe9;--mute:#9bacaa;--card:#182327;--line:#2a3a3e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barink);padding:calc(8px + env(safe-area-inset-top,0)) 10px 8px;display:flex;gap:8px;align-items:center}
header button{background:#ffffff1f;border:0;color:inherit;font-size:22px;width:44px;height:44px;border-radius:10px}
header input{flex:1;min-width:0;height:44px;border-radius:10px;border:0;padding:0 12px;font:inherit;background:#ffffff26;color:inherit}
header input::placeholder{color:#c9d6d0}
#res{position:fixed;left:0;right:0;top:calc(60px + env(safe-area-inset-top,0));max-height:60vh;overflow:auto;background:var(--card);border-bottom:2px solid var(--line);z-index:6;display:none}
#res a{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
#res img{width:40px;height:40px;image-rendering:pixelated}
#stage{position:relative;perspective:1900px;overflow-x:clip;--lx:0px;--ly:0px}
#page,.leaf{max-width:600px;margin:0 auto;padding:0 0 40px;min-height:80vh;background:var(--paper);touch-action:pan-y}
.leaf{position:absolute;top:var(--ly);left:var(--lx);right:var(--lx);overflow:hidden;min-height:0;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 30px #0006;pointer-events:none;z-index:4}
@media(min-width:1280px){
 :root{--maxw:1760px}
 .spread.s4{grid-template-columns:minmax(0,1.5fr) minmax(0,1.05fr) minmax(0,1.95fr);align-items:start}
 .s4 .art{width:min(88%,420px)}
 .s4 .views{gap:10px;margin-top:16px}.s4 .views button{max-width:104px;font-size:12px;padding:6px 2px}.s4 .views img{width:68px;height:68px}
 .s4 h1{font-size:46px}.s4 .no{font-size:16px}.s4 .chip{font-size:15px;padding:3px 14px}
 .s4>div{padding-bottom:18px;min-width:0}
 .mc{display:grid;grid-template-columns:1fr 1fr;align-items:start}.mc>div{min-width:0}
 .mc .mv{grid-template-columns:30px 1fr}.mc .mv .num,.mc .mv small{grid-column:2}.mc .mv .num{text-align:left;margin:0}
}
@media(min-width:720px){
 #stage{--lx:24px;--ly:20px;padding:20px 24px 28px}
 #page,.leaf{max-width:var(--maxw);padding:0;border-radius:10px}
 .leaf{left:calc(var(--lx) + (100% - 48px - min(var(--maxw),100% - 48px))/2);right:calc(var(--lx) + (100% - 48px - min(var(--maxw),100% - 48px))/2);top:var(--ly);padding:0;transform-origin:50% 50%}
 .spread{display:grid;grid-template-columns:1fr 1fr;min-height:70vh}
 .pg{padding-bottom:18px}
 .pg.r{padding-top:2px}
 .hero{margin:12px 12px 0;border-radius:12px}
 h1{font-size:36px}
 header{justify-content:center}header input{flex:0 1 520px}
 #res{left:50%;right:auto;transform:translateX(-50%);width:min(560px,96vw);border:2px solid var(--line);border-radius:0 0 12px 12px}
}

.art{width:min(62vw,240px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center;background:#ffffff40;border-radius:50%;border:3px solid #00000026}
.art img{width:86%;height:86%;image-rendering:pixelated;object-fit:contain}
.views{display:flex;gap:6px;justify-content:center;margin-top:12px}.views button{flex:1;max-width:88px;background:#ffffff2e;border:2px solid transparent;border-radius:10px;padding:4px 2px;color:#fff;font:inherit;font-size:11px;display:grid;justify-items:center;cursor:pointer}.views button.on{border-color:#fff;background:#ffffff5c}.views img{width:44px;height:44px;image-rendering:pixelated;object-fit:contain}
h1{font:700 30px/1.1 "Pixelify Sans",system-ui,sans-serif;margin:12px 0 4px;color:#fff;text-shadow:0 2px 0 #0003}
.no{color:#ffffffd9;font-size:14px}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#fff;background:color-mix(in srgb,var(--c) 80%,#000);border:2px solid #0003;text-shadow:0 1px 0 #0004}
section{background:var(--card);border-radius:14px;margin:12px 12px 0;padding:12px 14px}
h2{font:700 17px "Pixelify Sans",system-ui,sans-serif;margin:0 0 8px}
.desc{font-style:italic;font-weight:700;font-size:17.5px;line-height:1.4;color:var(--ink);margin:0}
.st{display:grid;grid-template-columns:38px 36px 1fr;gap:6px 8px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#8c9b9e}.bar i.hi{background:#3fa34d}.bar i.lo{background:#d24a43}
.ab{margin:0 0 8px}.ab b{display:block}.ab span{color:var(--mute);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute);margin-top:8px}
details{margin:0}summary{cursor:pointer;font:700 17px "Pixelify Sans",system-ui,sans-serif;padding:2px 0}
.mv{display:grid;grid-template-columns:34px 1fr auto;gap:2px 8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mv .lv{color:var(--mute);text-align:right;font-weight:700}
.mv .nm{font-weight:700}.mv small{grid-column:2/4;color:var(--mute)}
.mv .chip{font-size:11px;padding:0 7px;margin-left:6px}
.num{color:var(--mute);white-space:nowrap}
.link{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--t);text-underline-offset:3px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.leaf{display:none}}
.fbar{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;margin:12px 12px 0;padding:8px 12px;font-size:14px;box-shadow:0 4px 10px -6px #0005}
.fbar span{color:var(--mute);margin-right:2px}
.fbar button{display:flex;align-items:center;gap:6px;background:none;color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}
.fbar button i{width:10px;height:10px;border-radius:50%}
.fbar button.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.mv{transition:opacity .15s}.mv.dim{opacity:.35}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;height:54px;background:none;border:0;border-top:3px solid transparent;color:#b9c9c2;font:700 13px "Atkinson Hyperlegible",system-ui,sans-serif}
#tabs button.on{color:#fff;border-top-color:var(--t)}
body:not([data-tab="dex"]) #prev,body:not([data-tab="dex"]) #next{visibility:hidden}
#other{max-width:720px;margin:0 auto;padding:12px 12px 24px}
.vbar{display:flex;gap:8px;margin-bottom:10px}
.vbar select{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 8px}
.cnt{color:var(--mute);font-size:13px;margin:0 2px 8px}
.row{background:var(--card);border:1px solid transparent;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rh .num{margin-left:auto;font-size:13px}
.row .d{color:var(--mute);font-size:14px;margin-top:2px}
.det{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:14px;cursor:auto}
.det p{margin:6px 0}.row.open .det{display:block}.row.open{border-color:var(--t)}
.chips2{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:260px;overflow:auto}
.more{display:block;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.lk{cursor:pointer;text-decoration:underline;text-decoration-color:var(--t);text-decoration-thickness:2px;text-underline-offset:3px}
.msg{padding:40px 20px;text-align:center;color:var(--mute)}
button.sh{background:none;border:1px solid #fff9;color:#fff;border-radius:99px;padding:3px 12px;margin-top:8px;font:inherit;font-size:13px}

async function getText(u){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(r.status);return r}
async function load(){
  let lastErr;
  for(const b of BASES){
    try{
      let v=FALLBACK_VERSION;
      try{const t=await(await getText(b+"js/data_version.js")).text();const m=t.match(/allVersions\s*=\s*\[([^\]]*)\]/);if(m){const a=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);if(a.length)v=a[a.length-1]}}catch(e){}
      D=await(await getText(`${b}js/data/gameDataV${v}.json`)).json();
      base=b;D._v=v;return;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error("no data");

    const v=g.get(k).sort((p,q)=>p.id-q.id),megas=v.filter(isM),used=new Set();
    v.filter(x=>!isM(x)).forEach(n=>{out.push(n);megas.forEach(m=>{if(!used.has(m)&&bn(m)===n.name){used.add(m);out.push(m)}})});

function build(i,shiny){

  const abil=`<section><h2>Abilities</h2>${abis.map(A).join("")||"—"}</section>`,inn=`<section><h2>Innates</h2>${inns.map(A).join("")||"—"}</section>`;

function render(i,shiny,flip){

/* ---- Abilities / Moves / Locations ---- */
let pin=null,tab="dex",lim=60,ABL=[],MVL=[],LCL=[];const abN={};
const TABS={dex:"Search a Pokémon",abilities:"Search abilities",moves:"Search moves",locations:"Search places or Pokémon"};
function indexExtra(){
  const label={land:"Grass",water:"Surfing",fish:"Fishing",honey:"Honey tree",rock:"Rock Smash",hidden:"Hidden"};
  list.forEach(s=>new Set([...s.stats.abis,...s.stats.inns]).forEach(a=>abN[a]=(abN[a]||0)+1));
  const byName=(a,b)=>a.a.name.localeCompare(b.a.name);
  ABL=D.abilities.filter(a=>a.id>0&&a.name&&!/^-+$/.test(a.name)).map(a=>({a,t:(a.name+" "+a.desc).toLowerCase()})).sort(byName);
  MVL=D.moves.filter(m=>m.name&&!/^-+$/.test(m.name)).map(m=>({a:m,t:(m.name+" "+mdesc(m)).toLowerCase()})).sort(byName);
  LCL=(D.locations.maps||[]).map(m=>{
    const meth=[];
    for(const k in m){
      if(!Array.isArray(m[k])||!Array.isArray(m[k][0])||m[k][0].length!==3)continue;
      const mp=new Map();
      for(const [lo,hi,sp] of m[k]){const sc=sp>0?D.species[sp]:null;if(!sc)continue;const o=mp.get(sc.id)||{lo:999,hi:0,s:sc};o.lo=Math.min(o.lo,lo,hi);o.hi=Math.max(o.hi,lo,hi);mp.set(sc.id,o)}
      if(mp.size)meth.push([label[k]||k,[...mp.values()]]);
    }

    return{id:m.id,name,meth,n:new Set(meth.flatMap(x=>x[1].map(o=>o.s.id))).size,t:(name+" "+meth.map(x=>x[1].map(o=>o.s.name).join(" ")).join(" ")).toLowerCase()};
  }).filter(l=>l.meth.length);
}

const chipsOf=(arr,cap=150)=>`<div class="chips2">${arr.slice(0,cap).map(s=>lnk(s.id)).join("")}</div>${arr.length>cap?`<div class="num">and ${arr.length-cap} more</div>`:""}`;
